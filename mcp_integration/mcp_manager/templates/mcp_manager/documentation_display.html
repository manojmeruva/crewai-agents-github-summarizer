<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated GitHub Documentation</title>
    <style>
        /* GitHub Primer color tokens */
        :root {
            --canvas-default: #0d1117;
            --canvas-subtle: #161b22;
            --canvas-inset: #010409;
            --border-default: #30363d;
            --border-muted: #21262d;
            --fg-default: #e6edf3;
            --fg-muted: #7d8590;
            --fg-subtle: #6e7681;
            --accent-fg: #2f81f7;
            --accent-emphasis: #1f6feb;
            --success-fg: #3fb950;
            --success-emphasis: #238636;
            --done-fg: #a371f7;
            --attention-fg: #d29922;
            --danger-fg: #f85149;
            --neutral-muted: rgba(110, 118, 129, 0.4);
            --radius: 6px;
            --radius-lg: 12px;
        }

        :root[data-theme="light"] {
            --canvas-default: #ffffff;
            --canvas-subtle: #f6f8fa;
            --canvas-inset: #f6f8fa;
            --border-default: #d1d9e0;
            --border-muted: #d8dee4;
            --fg-default: #1f2328;
            --fg-muted: #59636e;
            --fg-subtle: #6e7781;
            --accent-fg: #0969da;
            --accent-emphasis: #0969da;
            --success-fg: #1a7f37;
            --success-emphasis: #1f883d;
            --done-fg: #8250df;
            --attention-fg: #9a6700;
            --danger-fg: #d1242f;
            --neutral-muted: rgba(175, 184, 193, 0.2);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--canvas-default);
            color: var(--fg-default);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                         Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Top navigation bar ---------- */
        .app-header {
            background-color: var(--canvas-inset);
            border-bottom: 1px solid var(--border-default);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        :root[data-theme="light"] .app-header {
            background-color: var(--canvas-default);
        }

        .app-header .mark { color: var(--fg-default); display: flex; }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-title .sep { color: var(--fg-subtle); font-weight: 400; }
        .header-title a { color: var(--accent-fg); text-decoration: none; }
        .header-title a:hover { text-decoration: underline; }

        .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 500;
            line-height: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-default);
            background-color: var(--canvas-subtle);
            color: var(--fg-default);
            cursor: pointer;
            text-decoration: none;
            transition: background-color .15s ease, border-color .15s ease;
            white-space: nowrap;
        }
        .btn:hover { background-color: var(--border-muted); border-color: var(--fg-subtle); }
        .btn-primary {
            background-color: var(--success-emphasis);
            border-color: rgba(240,246,252,0.1);
            color: #ffffff;
        }
        .btn-primary:hover { background-color: #2ea043; }
        .btn-icon { padding: 5px 8px; }

        /* ---------- Layout ---------- */
        .container {
            max-width: 1012px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ---------- Repo hero ---------- */
        .repo-hero {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding-bottom: 16px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-muted);
        }
        .repo-hero .repo-icon { color: var(--fg-muted); margin-top: 4px; flex-shrink: 0; }
        .repo-name {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            word-break: break-word;
        }
        .repo-name a { color: var(--accent-fg); text-decoration: none; }
        .repo-name a:hover { text-decoration: underline; }
        .repo-meta {
            margin-top: 4px;
            font-size: 12px;
            color: var(--fg-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .repo-meta span { display: inline-flex; align-items: center; gap: 4px; }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0 7px;
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            border: 1px solid var(--border-default);
            border-radius: 2em;
            color: var(--fg-muted);
        }

        /* ---------- Section cards ---------- */
        .section-card {
            background-color: var(--canvas-default);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color .15s ease;
        }
        .section-card:hover { border-color: var(--fg-subtle); }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: var(--canvas-subtle);
            border-bottom: 1px solid var(--border-default);
            cursor: pointer;
            user-select: none;
        }
        .section-header:hover { background-color: var(--border-muted); }

        .section-header .icon { display: flex; flex-shrink: 0; }
        .icon-structure { color: var(--accent-fg); }
        .icon-issues    { color: var(--success-fg); }
        .icon-pulls     { color: var(--done-fg); }
        .icon-branches  { color: var(--attention-fg); }
        .icon-default   { color: var(--fg-muted); }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            flex: 1;
            min-width: 0;
        }

        .chevron {
            color: var(--fg-muted);
            transition: transform .2s ease;
            flex-shrink: 0;
        }
        .section-card.collapsed .chevron { transform: rotate(-90deg); }
        .section-card.collapsed .section-body { display: none; }

        .section-body { padding: 16px; }

        /* ---------- Markdown content ---------- */
        .md h1, .md h2, .md h3 {
            font-weight: 600;
            line-height: 1.25;
            margin-top: 24px;
            margin-bottom: 12px;
        }
        .md > :first-child { margin-top: 0; }
        .md h1 { font-size: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--border-muted); }
        .md h2 {
            font-size: 15px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-muted);
            color: var(--fg-default);
        }
        .md h3 { font-size: 14px; }
        .md p { margin: 0 0 12px; color: var(--fg-default); }
        .md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
        .md li { margin-bottom: 4px; }
        .md li::marker { color: var(--fg-muted); }
        .md a { color: var(--accent-fg); text-decoration: none; }
        .md a:hover { text-decoration: underline; }
        .md strong { font-weight: 600; color: var(--fg-default); }
        .md hr { display: none; }

        .md code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background-color: var(--neutral-muted);
            border-radius: var(--radius);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                         "Liberation Mono", monospace;
        }
        .md pre {
            padding: 16px;
            overflow: auto;
            background-color: var(--canvas-subtle);
            border-radius: var(--radius);
            border: 1px solid var(--border-muted);
        }
        .md pre code { background: transparent; padding: 0; }

        .md blockquote {
            margin: 0 0 12px;
            padding: 0 1em;
            color: var(--fg-muted);
            border-left: 3px solid var(--border-default);
        }

        .md table { border-collapse: collapse; width: 100%; margin-bottom: 12px; display: block; overflow-x: auto; }
        .md th, .md td { padding: 6px 13px; border: 1px solid var(--border-default); }
        .md th { background-color: var(--canvas-subtle); font-weight: 600; }

        /* ---------- File browser ---------- */
        .file-browser {
            border: 1px solid var(--border-default);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .file-browser-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--canvas-subtle);
            border-bottom: 1px solid var(--border-default);
            font-size: 12px;
            color: var(--fg-muted);
        }
        .file-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-muted);
            font-size: 14px;
        }
        .file-row:last-child { border-bottom: 0; }
        .file-row:hover { background-color: var(--canvas-subtle); }
        .file-row .ficon { display: flex; flex-shrink: 0; }
        .file-row .ficon.dir  { color: var(--accent-fg); }
        .file-row .ficon.file { color: var(--fg-muted); }
        .file-row a {
            color: var(--fg-default);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-row a:hover { color: var(--accent-fg); text-decoration: underline; }
        .file-row.is-dir a { font-weight: 500; }

        /* ---------- Empty state ---------- */
        .blankslate {
            text-align: center;
            padding: 48px 24px;
            border: 1px dashed var(--border-default);
            border-radius: var(--radius-lg);
            color: var(--fg-muted);
        }
        .blankslate svg { color: var(--fg-subtle); margin-bottom: 16px; }
        .blankslate h3 { margin: 0 0 8px; font-size: 16px; color: var(--fg-default); }

        /* ---------- Footer ---------- */
        .app-footer {
            border-top: 1px solid var(--border-muted);
            margin-top: 32px;
            padding: 24px;
            text-align: center;
            color: var(--fg-muted);
            font-size: 12px;
        }
        .app-footer a { color: var(--accent-fg); text-decoration: none; }
        .app-footer a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .container { padding: 16px; }
            .app-header { padding: 12px 16px; }
            .header-title { font-size: 13px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <span class="mark">
            <svg height="28" viewBox="0 0 16 16" width="28" fill="currentColor" aria-hidden="true">
                <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27s-1.36.09-2 .27c-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
            </svg>
        </span>
        <div class="header-title">
            <span>Repository Documentation</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-icon" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
                <svg id="theme-icon" height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Z"></path>
                </svg>
            </button>
            <a href="{% url 'documentation_interface' %}" class="btn">
                <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"></path>
                </svg>
                New analysis
            </a>
        </div>
    </header>

    <div class="container">
        {% if documentation %}
            <div id="raw-source" hidden>{{ documentation|safe }}</div>
            <div id="rendered"></div>
        {% else %}
            <div class="blankslate">
                <svg height="48" width="48" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"></path>
                </svg>
                <h3>No documentation generated yet</h3>
                <p>Run an analysis on a repository to see results here.</p>
            </div>
        {% endif %}
    </div>

    <footer class="app-footer">
        Generated by CrewAI agents via the GitHub MCP Server ·
        <a href="{% url 'documentation_interface' %}">Analyze another repository</a>
    </footer>

    <script>
    (function () {
        // ----- Theme handling -----
        var root = document.documentElement;
        var SUN = 'M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8Zm-8 5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm-5.657-.343a.75.75 0 0 1 1.061 0l1.06 1.061a.75.75 0 0 1-1.06 1.06l-1.061-1.06a.75.75 0 0 1 0-1.06Zm9.193-9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061Z';
        var MOON = 'M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Z';

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            var icon = document.getElementById('theme-icon');
            if (icon) icon.innerHTML = '<path d="' + (theme === 'dark' ? MOON : SUN) + '"></path>';
            try { localStorage.setItem('docs-theme', theme); } catch (e) {}
        }

        var stored = null;
        try { stored = localStorage.getItem('docs-theme'); } catch (e) {}
        applyTheme(stored || 'dark');

        var toggle = document.getElementById('theme-toggle');
        if (toggle) {
            toggle.addEventListener('click', function () {
                applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });
        }

        // ----- Split the flat markdown output into cards -----
        var source = document.getElementById('raw-source');
        var target = document.getElementById('rendered');
        if (!source || !target) return;

        var ICONS = {
            structure: 'M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z',
            issues: 'M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z',
            pulls: 'M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z',
            branches: 'M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.493 2.493 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z',
            'default': 'M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Z'
        };

        function classify(title) {
            var t = title.toLowerCase();
            if (t.indexOf('structure') > -1 || t.indexOf('repository structure') > -1) return 'structure';
            if (t.indexOf('issue') > -1) return 'issues';
            if (t.indexOf('pull request') > -1) return 'pulls';
            if (t.indexOf('branch') > -1) return 'branches';
            return 'default';
        }

        function svg(path, cls) {
            return '<span class="icon icon-' + cls + '">' +
                   '<svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
                   '<path d="' + path + '"></path></svg></span>';
        }

        // Walk the flat node list, splitting on <hr> boundaries.
        var nodes = Array.prototype.slice.call(source.childNodes);
        var groups = [];
        var current = [];
        nodes.forEach(function (node) {
            if (node.nodeType === 1 && node.tagName === 'HR') {
                if (current.length) groups.push(current);
                current = [];
            } else {
                current.push(node);
            }
        });
        if (current.length) groups.push(current);

        // Drop groups that carry no visible content.
        groups = groups.filter(function (g) {
            return g.some(function (n) { return (n.textContent || '').trim().length > 0; });
        });

        if (!groups.length) { target.innerHTML = source.innerHTML; return; }

        // The very first heading is the overall summary title -> hero banner.
        var heroTitle = '';
        var firstGroup = groups[0];
        var firstHeading = firstGroup.filter(function (n) {
            return n.nodeType === 1 && n.tagName === 'H1';
        })[0];
        if (firstHeading) {
            heroTitle = firstHeading.textContent.replace(/^Summary for\s*/i, '').trim();
            firstHeading.parentNode && firstHeading.parentNode.removeChild(firstHeading);
            firstGroup = firstGroup.filter(function (n) { return n !== firstHeading; });
            groups[0] = firstGroup;
            if (!firstGroup.some(function (n) { return (n.textContent || '').trim().length; })) {
                groups.shift();
            }
        }

        var frag = document.createDocumentFragment();

        if (heroTitle) {
            var hero = document.createElement('div');
            hero.className = 'repo-hero';
            hero.innerHTML =
                '<span class="repo-icon">' +
                '<svg height="24" width="24" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
                '<path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path>' +
                '</svg></span>' +
                '<div><h1 class="repo-name">' +
                '<a href="https://github.com/' + heroTitle + '" target="_blank" rel="noopener noreferrer">' +
                heroTitle + '</a></h1>' +
                '<div class="repo-meta">' +
                '<span class="badge">' + groups.length + ' report' + (groups.length === 1 ? '' : 's') + '</span>' +
                '<span>Analyzed by CrewAI agents</span>' +
                '</div></div>';
            frag.appendChild(hero);
        }

        // Turn a flat list of repo entries into a GitHub-style file browser.
        // Entry type comes from the URL: /tree/ is a directory, /blob/ a file.
        var DIR_ICON  = 'M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z';
        var FILE_ICON = 'M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z';

        // Parse one <ul> into a tree of {name, href, isDir, children}.
        function parseList(ul) {
            var out = [];
            Array.prototype.forEach.call(ul.children, function (li) {
                if (li.tagName !== 'LI') return;

                var childUl = li.querySelector(':scope > ul');
                var a = li.querySelector(':scope > a');

                // The label is this node's own text, excluding any nested list.
                var label = '';
                Array.prototype.forEach.call(li.childNodes, function (n) {
                    if (n.nodeType === 1 && n.tagName === 'UL') return;
                    label += n.textContent;
                });
                label = label.trim().replace(/\s*\(empty\)\s*$/i, '');

                var href = a ? a.getAttribute('href') : '';
                var isDir = /\/tree\//.test(href) || /\/$/.test(label) || !!childUl;
                var name = label.replace(/\/$/, '').trim();
                if (!name) return;

                out.push({
                    name: name,
                    href: href,
                    isDir: isDir,
                    children: childUl ? parseList(childUl) : []
                });
            });
            return out;
        }

        function sortEntries(list) {
            // GitHub orders directories first, then files, each alphabetically.
            list.sort(function (a, b) {
                if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
                return a.name.localeCompare(b.name);
            });
            list.forEach(function (e) { if (e.children.length) sortEntries(e.children); });
            return list;
        }

        function countEntries(list, acc) {
            list.forEach(function (e) {
                if (e.isDir) acc.dirs++; else acc.files++;
                countEntries(e.children, acc);
            });
            return acc;
        }

        function renderRows(list, depth, into) {
            list.forEach(function (e) {
                var row = document.createElement('div');
                row.className = 'file-row' + (e.isDir ? ' is-dir' : '');
                row.style.paddingLeft = (16 + depth * 20) + 'px';

                var label = e.href
                    ? '<a href="' + e.href + '" target="_blank" rel="noopener noreferrer">' + e.name + '</a>'
                    : '<span>' + e.name + '</span>';
                row.innerHTML =
                    '<span class="ficon ' + (e.isDir ? 'dir' : 'file') + '">' +
                    '<svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
                    '<path d="' + (e.isDir ? DIR_ICON : FILE_ICON) + '"></path></svg></span>' + label;

                into.appendChild(row);
                if (e.children.length) renderRows(e.children, depth + 1, into);
            });
        }

        function buildFileBrowser(ul) {
            var tree = sortEntries(parseList(ul));
            if (!tree.length) return null;

            var counts = countEntries(tree, { dirs: 0, files: 0 });

            var wrap = document.createElement('div');
            wrap.className = 'file-browser';

            var head = document.createElement('div');
            head.className = 'file-browser-head';
            head.innerHTML =
                '<svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
                '<path d="' + DIR_ICON + '"></path></svg>' +
                '<span>' + counts.dirs + ' ' + (counts.dirs === 1 ? 'folder' : 'folders') +
                ' · ' + counts.files + ' ' + (counts.files === 1 ? 'file' : 'files') + '</span>';
            wrap.appendChild(head);

            renderRows(tree, 0, wrap);
            return wrap;
        }

        groups.forEach(function (group, index) {
            var heading = group.filter(function (n) {
                return n.nodeType === 1 && /^H[12]$/.test(n.tagName);
            })[0];

            // The file-tree group loses its own heading to the hero banner, so
            // name it explicitly rather than falling back to a generic label.
            var fallback = (index === 0 && heroTitle) ? 'Repository Structure' : 'Report';
            var title = heading ? heading.textContent.trim() : fallback;
            // Strip the trailing "for owner/repo" so headers stay compact.
            var shortTitle = title.replace(/\s+for\s+\S+\/\S+\s*$/i, '').trim() || title;
            var kind = classify(title);

            var card = document.createElement('section');
            card.className = 'section-card';

            var header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = svg(ICONS[kind], kind) +
                '<h2 class="section-title">' + shortTitle + '</h2>' +
                '<svg class="chevron" height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
                '<path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"></path></svg>';

            var body = document.createElement('div');
            body.className = 'section-body md';
            group.forEach(function (n) {
                if (n === heading) return;   // title already shown in the card header
                body.appendChild(n);
            });

            // Render the repo listing as a file browser instead of a bare list.
            if (kind === 'structure') {
                var ul = body.querySelector('ul');
                if (ul) {
                    var browser = buildFileBrowser(ul);
                    if (browser) ul.parentNode.replaceChild(browser, ul);
                }
            }

            header.addEventListener('click', function () { card.classList.toggle('collapsed'); });

            card.appendChild(header);
            card.appendChild(body);
            frag.appendChild(card);
        });

        target.appendChild(frag);
        source.remove();
    })();
    </script>
</body>
</html>
